name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python run_eval.py
      - run: python -m pytest tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: out/report.md
