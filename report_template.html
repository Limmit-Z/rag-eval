<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAG 离线检索</title>
<style>body{font:16px system-ui;max-width:960px;margin:2rem auto;padding:0 1rem;color:#243047;background:#f5f7fa}label{display:inline-block;margin:.5rem}input,select,button{font:inherit;padding:.5rem}#question{width:min(90%,38rem)}article{background:white;border:1px solid #dce2ed;border-radius:8px;padding:1rem;margin:1rem 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#4f617a}</style></head><body>
<h1>RAG 离线检索</h1><p>输入任意问题，查看使用 mock 向量与 BM25 融合的结果。得分是检索分数；黄金题评测分数见 Markdown 报告。</p>
<form id="form"><input id="question" aria-label="问题" placeholder="输入问题" required><button>检索</button><br>
<label>分块策略 <select id="strategy"><option>fixed</option><option>semantic</option><option>recursive</option></select></label>
<label>向量权重 <select id="weight"><option value="0.5">0.5</option><option value="1">1.0</option><option value="0">0.0</option></select></label>
<label>Top-K <input id="topk" type="number" min="1" max="50" value="5"></label></form><p id="status" role="status"></p><div id="results"></div>
<script>
const data=/*DATA*/;
const $=id=>document.getElementById(id); const cache={};
function terms(text){let out=[];for(const m of text.toLowerCase().matchAll(/[a-z0-9_]+|[\u4e00-\u9fff]+/g)){let t=m[0];if(/[\u4e00-\u9fff]/.test(t[0])){if(t.length===1)out.push(t);else for(let i=0;i<t.length-1;i++)out.push(t.slice(i,i+2));}else out.push(t)}return out}
function hash(t){let h=2166136261;for(const b of new TextEncoder().encode(t))h=Math.imul(h^b,16777619)>>>0;return h%256}
function vector(ts){let v=new Float64Array(256);for(const t of ts)v[hash(t)]++;let n=Math.hypot(...v);if(n)for(let i=0;i<256;i++)v[i]/=n;return v}
function grams(text){let t=Array.from(text.toLowerCase().replace(/\s+/g,'')),a=[];if(t.length===1)return t;for(let i=0;i<t.length-1;i++)a.push(t[i]+t[i+1]);return a}
function prepare(name){if(cache[name])return cache[name];let chunks=data[name], df=new Map(), total=0, entries=chunks.map(c=>{let ts=terms(c.text), counts=new Map();for(const t of ts)counts.set(t,(counts.get(t)||0)+1);for(const t of counts.keys())df.set(t,(df.get(t)||0)+1);total+=ts.length;return {c,counts,len:ts.length,v:vector(grams(c.text))}});return cache[name]={entries,df,avg:total/chunks.length}}
function normalize(a){let lo=Infinity,hi=-Infinity;for(const n of a){lo=Math.min(lo,n);hi=Math.max(hi,n)}return a.map(n=>hi===lo?0:(n-lo)/(hi-lo))}
function search(){const q=$('question').value.trim();if(!q)return;const {entries,df,avg}=prepare($('strategy').value), qt=terms(q), qv=vector(grams(q)), unique=[...new Set(qt)];let vec=[],bm=[];for(const e of entries){let dot=0,score=0;for(let i=0;i<256;i++)dot+=qv[i]*e.v[i];for(const t of unique){let tf=e.counts.get(t)||0;if(tf){let idf=Math.log(1+(entries.length-df.get(t)+.5)/(df.get(t)+.5));score+=idf*tf*2.5/(tf+1.5*(.25+.75*e.len/avg))}}vec.push(dot);bm.push(score)}vec=normalize(vec);bm=normalize(bm);const w=+$('weight').value;let order=entries.map((e,i)=>({e,i,s:w*vec[i]+(1-w)*bm[i]})).sort((a,b)=>b.s-a.s||a.i-b.i);let seen=new Set(), hits=[];for(const item of order){let k=JSON.stringify([item.e.c.doc_id,item.e.c.text]);if(seen.has(k))continue;seen.add(k);hits.push(item);if(hits.length>=+$('topk').value)break}$('results').replaceChildren();for(const [i,h] of hits.entries()){const a=document.createElement('article'),title=document.createElement('strong'),meta=document.createElement('small'),pre=document.createElement('pre');title.textContent=`${i+1}. ${h.e.c.path} · ${h.s.toFixed(4)}`;meta.textContent='\n'+h.e.c.section_path.join(' > ');pre.textContent=h.e.c.text;a.append(title,document.createElement('br'),meta,pre);$('results').append(a)}$('status').textContent=`找到 ${hits.length} 个结果。`}
$('form').addEventListener('submit',e=>{e.preventDefault();$('status').textContent='正在检索…';setTimeout(()=>{try{search()}catch(err){$('status').textContent='检索失败：'+err.message}},20)});
</script></body></html>
